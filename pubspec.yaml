name: wake_me_there
description: Never miss your stop. WakeMeThere alerts you before you arrive.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  maplibre_gl: 0.22.0
  http: ^1.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  go_router: ^14.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
